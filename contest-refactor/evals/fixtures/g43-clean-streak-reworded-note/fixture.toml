notes = "THE load-bearing case. An earlier design of this gate compared the free-form proposal text, which this skill's own production finding -- 'Free-form residual wording defeats candidate recurrence' -- had already shown to be defeatable: a reword yields a different hash while meaning the same thing, so a loop obliged to produce something new each loop can satisfy the check by rewording. Novelty is therefore judged on the structured triple, and the free-prose note and clean_rationale fields are excluded from the comparison. This fixture pins that: the note changes completely, the triple does not, and G43 still fires. Built from g39-score-impact-valid replicated across 4 loops -- the first v4 fixtures at loop >= 4, which G43's floor requires (loop 1's delta is SAME by definition, so at loop 4 the three observations are loops 4/3/2 and loop 2's is the first real one). REVIEW_HISTORY.json carries 4 entries with loops[-1] equal to CURRENT_REVIEW.json (G18) and REVIEW_HISTORY.md one divider per loop (G22). Only architecture_quality is left stalled; every other sub-9.5 dimension carries delta UP on the current loop so it is not owed a pass, keeping exactly one dimension in scope. Verified: strict mode reports exactly one FAIL, [G43]."

