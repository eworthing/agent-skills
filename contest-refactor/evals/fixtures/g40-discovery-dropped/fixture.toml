id = "g40-discovery-dropped"
purpose = "Negative v4 fixture whose `discovery` is null; protects G40 against regression to the pre-v4 schema rule that told loops to null the Step-0 handoff after the first loop."
expected_result = "fail"
notes = "Reproduces the exact shape a real 10-loop run emitted while obeying the old schema comment ('required first loop only; null on later loops'). That comment contradicted three consumers already written against the opposite assumption: rule #27 reads discovery.test_scope, G21's incremental->full reverify reads it on the HALT_SUCCESS-emitting loop, and candidate_fingerprint.py binds discovery.lens + discovery.source_roots (a null discovery fingerprints a success candidate as lens=null). The operational cost is the one that matters - build_command lives in this object, so once it is dropped a loop has only the test command left and can treat a green suite as full ground truth on a repo whose test target and build target compile different file sets. Derived from g39-score-impact-valid with `discovery` nulled in BOTH CURRENT_REVIEW.json and REVIEW_HISTORY.json.loops[-1] so G18's verbatim-equality check still holds and G40 is the only gate that fires. Positive coverage is carried by every other v4 fixture; the field-level cases (source_roots empty, test_command blank, lens missing, wrong types) and the later-loop regression shape live in scripts/_g40_selftest.py."

[[tested_rules]]
kind = "gate"
id = "G40"

