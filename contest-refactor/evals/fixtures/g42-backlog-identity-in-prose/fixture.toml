id = "g42-backlog-identity-in-prose"
purpose = "Negative v4 fixture whose backlog item carries no `stable_id` and leaves its identity inside the title text ('... (Finding F-001)'); protects G42 against regression to prose-only backlog identity."
expected_result = "fail"
pair_exception = "shared-baseline-mutation: derived from pass fixture 'g39-score-impact-valid' by mutating a single field to trigger G42; 'g39-score-impact-valid' is a shared clean baseline for other independent negative siblings, not this fixture's dedicated 1:1 twin."
aspirational = false
notes = "This is the pre-G42 shape, and its point is that everything a rule CAN read is already correct: priority, rank, kind, why_it_matters, and the machine-readable score_impact G39 added. Only the identity is prose, so following one item across loops means regex-scraping '(Finding F-001)' out of English - the exact anti-pattern G39 was written to remove, one field over. Without identity every cross-loop question about the backlog is unanswerable: how many loops has this been queued, was it deferred or newly raised, has the same item been displaced three loops running. The Backlog Prioritization Pass's item-deferral criterion asks precisely those questions. The registry is not a substitute: findings_registry.json records an occurrence per loop while a finding is OPEN, which is not the same as being in the backlog - a production run carried a Cosmetic off-path finding as open for all ten loops while it never appeared in a backlog once. Derived from g39-score-impact-valid by deleting `stable_id` and appending the id to the title, in both CURRENT_REVIEW.json and REVIEW_HISTORY.json.loops[-1] so G18's verbatim-equality check still holds and G42 is the only gate that fires. Positive coverage is carried by every other v4 fixture with a backlog; malformed-id and dangling-reference cases live in scripts/_g42_selftest.py."

[[tested_rules]]
kind = "gate"
id = "G42"

